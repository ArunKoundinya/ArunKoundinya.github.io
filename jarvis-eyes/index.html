<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0d10; color:#e9edf2; font:15px/1.5 system-ui,sans-serif;
         display:flex; flex-direction:column; height:100dvh; }
  video { flex:1; width:100%; object-fit:cover; background:#000; }
  .bar { padding:14px 16px calc(14px + env(safe-area-inset-bottom));
         display:flex; gap:12px; align-items:center; background:#14181d; }
  button { flex:1; padding:16px; font-size:17px; font-weight:600; border:0; border-radius:12px;
           background:#2b6cb0; color:#fff; }
  button.on { background:#9b2c2c; }
  .meta { font-size:13px; color:#8b949e; min-width:110px; text-align:right; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
         background:#444; margin-right:6px; }
  .dot.live { background:#48bb78; }
  .dot.stale { background:#d69e2e; }
  .err { padding:12px 16px; background:#742a2a; font-size:14px; }
</style></head>
<body>
<video id="v" playsinline autoplay muted></video>
<div id="err" class="err" hidden></div>
<div class="bar">
  <button id="go">Start watching</button>
  <div class="meta"><span id="dot" class="dot"></span><span id="status">idle</span></div>
</div>
<script>
const ENDPOINT = "https://vojzksyfdmmhcrfqaxuh.supabase.co/functions/v1/eyes";
const EVERY_MS = 8000;      // often enough for a cook, cheap enough to leave on
const MAX_EDGE = 1024;      // a phone photo base64s to megabytes; this does not
const token = new URL(location.href).searchParams.get("t") ||
              localStorage.getItem("jarvis_eyes_token");
if (token) localStorage.setItem("jarvis_eyes_token", token);

const v = document.getElementById("v"), go = document.getElementById("go");
const status = document.getElementById("status"), dot = document.getElementById("dot");
const errBox = document.getElementById("err");
let stream = null, wake = null, sent = 0, running = false, lastOk = 0, loop = null;

const fail = (m) => { errBox.textContent = m; errBox.hidden = false; };
if (!token) fail("No token. Open the link with ?t=... once; it is remembered after that.");

// Show the AGE of the last successful send, not a count.
//
// A count only ever goes up, so a camera that stopped ten minutes ago looks
// exactly like one that is working. Age makes a stall visible, which matters
// because the failure here is silent: iOS suspends the page the moment you
// glance at a notification.
function paint() {
  if (!running) { status.textContent = "stopped"; dot.classList.remove("live","stale"); return; }
  const age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : null;
  status.textContent = age === null ? "starting…" : age + "s ago";
  dot.classList.toggle("live", age !== null && age < 30);
  dot.classList.toggle("stale", age !== null && age >= 30);
}
setInterval(paint, 1000);

async function frame() {
  if (!stream || v.videoWidth === 0) return;
  const c = document.createElement("canvas");
  const s = Math.min(1, MAX_EDGE / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  const b64 = c.toDataURL("image/jpeg", 0.6).split(",")[1];
  try {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json", "x-eyes-token": token },
      body: JSON.stringify({ image: b64 }),
    });
    if (!r.ok) { fail("Upload refused: " + r.status + " " + (await r.text()).slice(0,80)); return; }
    errBox.hidden = true; lastOk = Date.now(); sent++; paint();
  } catch (e) { fail("Upload failed: " + e.message); }
}

// A self-rescheduling loop rather than setInterval.
//
// iOS throttles and then freezes interval timers in a backgrounded page, and
// an interval that has been frozen does not reliably resume. Re-arming after
// each send means returning to the page always gets a working cadence back.
function schedule() {
  clearTimeout(loop);
  if (!running) return;
  loop = setTimeout(async () => { await frame(); schedule(); }, EVERY_MS);
}

// The wake lock is RELEASED automatically whenever the document hides, and
// does not come back by itself — so without re-requesting it the screen sleeps
// on the first glance away and the eyes close for good.
async function holdScreen() {
  try { wake = await navigator.wakeLock?.request("screen"); } catch (_) {}
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
      audio: false,
    });
  } catch (e) { fail("Camera refused: " + e.message); return; }
  v.srcObject = stream;
  running = true;
  await holdScreen();
  await frame();
  schedule();
  go.textContent = "Stop watching"; go.classList.add("on"); paint();
}

function stop() {
  running = false; clearTimeout(loop); loop = null;
  stream?.getTracks().forEach((t) => t.stop()); stream = null;
  wake?.release?.(); wake = null;
  go.textContent = "Start watching"; go.classList.remove("on"); paint();
}

go.onclick = () => (running ? stop() : start());

// Coming back from a lock screen or an app switch: take the wake lock again,
// send immediately so the age resets, and re-arm the loop rather than trusting
// that a frozen timer survived.
document.addEventListener("visibilitychange", async () => {
  if (document.hidden || !running) return;
  await holdScreen();
  await frame();
  schedule();
});

// Try to open the eyes without being asked twice. Safari needs a gesture the
// first time; once the origin is permitted it usually hands the camera over on
// load. If it refuses, the button is still there, so trying costs nothing.
(async () => {
  if (!token) return;
  try {
    const p = await navigator.permissions?.query({ name: "camera" });
    if (p && p.state !== "granted") return;
  } catch (_) { /* Safari often cannot answer this; try anyway */ }
  try { await start(); } catch (_) { /* the button remains */ }
})();
</script>
</body></html>
